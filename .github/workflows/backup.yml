name: Cloudflare R2 Backup

on:
  schedule:
    - cron: "0 0 * * 0" # every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The R2 action uploads an existing file; it doesn't create one. git archive packs the committed tree only
      # (no .git, nothing gitignored). The name comes from github.repository because scheduled runs have no
      # github.event.repository.
      - name: Create archive
        id: archive
        run: |
          file="${GITHUB_REPOSITORY#*/}_backup.tar.gz"
          git archive --format=tar.gz --prefix="${GITHUB_REPOSITORY#*/}/" -o "$file" HEAD
          ls -l "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: NX1X/Cloudflare-R2-backup-action@v1
        with:
          operation: upload
          account-id: ${{ secrets.CF_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: github
          file: ${{ steps.archive.outputs.file }}
          retention-days: '90'
